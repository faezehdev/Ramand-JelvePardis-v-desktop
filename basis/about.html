  <main class="aboutUs bg-b4">
    <basis core="print" datamembername="db.image-about">
        <layout>
          <section class="section1" dir="rtl">
            <div class="section1 relative flex justify-center items-center" dir="rtl">
              @child
            </div>
          </section>
        </layout>
        <face filter="ord=1">
          <div class="imgS w-full">
            <img class="w-full" src="/@largeIMG" alt="@name" title="@name" />
          </div>
  
          <div class="title py-11 text-center absolute left-0 right-0">
            <h1 class="font-IRANSansWeb300 text-3xl scrollToTop text-b7">
            @name
            </h1>
            <p class="text-clip font-IRANSansWeb400 scrollToTop text-base text-b1 mt-1">
              @description
            </p>
          </div>
            
        </face>
    </basis>
    <basis core="print" datamembername="db.aboutus">
        <layout>
          <section class="section2 py-40 flex justify-center" dir="rtl">
            <div class="para scrollToTop max-w-[885px] font-IRANSansWeb400 text-sm text-center text-b1">
          
              @child
            </div>
          </section>
        </layout>
        <face filter="TypeID=250">
            @Answer
        </face>
    </basis>

    <section class="section3" dir="rtl">
      <div class="inVideo flex justify-center items-center">
        <basis core="print" datamembername="db.image-about">

            <face filter="ord=10">
              <video class="w-full object-cover" poster="/@largeIMG" playsinline loop>
                
            </face>
        </basis>
        <basis core="print" datamembername="db.video-about">
            <face>
                
              <source src="/@largeIMG">
            </face>
        </basis>
        </video>
        <div class="playbtn absolute cursor-pointer">

          <div class="section4 my-40 pr-24 pl-10" dir="rtl">
        
            @child
          </div>
        </layout>
        <face filter="TypeID=150">
